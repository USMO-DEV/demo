# 前后端分离编排（引用本机镜像，由前后端各自的 Jenkins 流水线构建）
# 使用：docker compose up -d
services:
  backend:
    image: demo-java-api:latest
    restart: unless-stopped
    networks:
      - demo-net

  frontend:
    image: demo-web:latest
    ports:
      - "8888:80"
    depends_on:
      - backend
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-net
