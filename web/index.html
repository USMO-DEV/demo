<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Demo 应用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }
  h1 { font-size: 2.2rem; margin-bottom: 12px; }
  p { opacity: 0.85; margin-bottom: 28px; }
  .time-box {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 28px;
    font-variant-numeric: tabular-nums;
  }
  button {
    padding: 12px 32px;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: #fff;
    color: #5a4fcf;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); }
  .tip { margin-top: 20px; font-size: 0.85rem; opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <h1>你好，Java 👋</h1>
    <p>这是一个由 Java HttpServer 驱动的简单 Web 应用</p>
    <div class="time-box" id="time">--:--:--</div>
    <button onclick="refreshTime()">刷新服务器时间</button>
    <div class="tip">数据来自后端接口 /api/time</div>
  </div>

<script>
  async function refreshTime() {
    try {
      const res = await fetch('/api/time');
      const data = await res.json();
      document.getElementById('time').textContent = data.time;
    } catch (e) {
      document.getElementById('time').textContent = '请求失败';
    }
  }
  refreshTime();
  setInterval(refreshTime, 1000);
</script>
</body>
</html>
